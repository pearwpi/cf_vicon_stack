# Parameters for the Vicon-fed Crazyflie driver.
#
# Units are metres, seconds, degrees per second, and Hz. Read the UNITS block
# at the top of crazyflie_server.py before changing anything that touches yaw.

/crazyflie_server:
  ros__parameters:
    uri: "radio://0/80/2M/E7E7E7E703"   # acp_cf_03, confirmed by radio scan
    # Vicon object "cf3" (per the operator). Confirm the topic exists with
    # `ros2 topic list | grep vicon` once the bridge is running.
    vicon_topic: "/vicon/cf3/cf3"
    prefix: "cf1"

    control_hz: 50.0          # setpoint transmit rate
    extpose_hz: 50.0          # mocap -> EKF injection rate; keep <= 100 on a 2M link
    mocap_expected_hz: 100.0  # what Vicon is expected to publish at

    # No cmd_* for this long while flying and the driver stops relaying and
    # holds position. Must stay well inside the firmware's own 500 ms
    # COMMANDER_WDT_TIMEOUT_STABILIZE so that we decide, not the firmware.
    command_timeout: 0.30

    max_yaw_rate_dps: 720.0   # above this AND >45 deg in one frame -> solver flip
    yaw_sign: 1               # flip to -1 if yaw commands act backwards.
                              # VERIFY WITH THE PROPELLERS OFF.
    yaw_offset: 0.0           # empirical rotation applied to the injected quat

    pos_only: false           # true = withhold the quaternion, inject position only
    no_fly: false             # true = connect and inject, never spin a motor

    hover_z: 0.60
    # volume: [2.0, 2.0, 1.20]   # width(x), depth(y), ceiling(z); auto-centred
                                 # on the drone's position at startup. Only
                                 # sane in a small, symmetric space.
    # bounds: [xmin, xmax, ymin, ymax, zmin, zmax]  -- absolute, Vicon frame.
    # = the 7.0 x 3.0 x 2.5 m SIM ARENA the policies are trained in, mapped into
    # Vicon coordinates with pe_hitl's washburn_calib.yaml (marks' rectangle
    # assumed centred on the arena; h0 = 0.30, so the arena top is 2.80 m above
    # the floor). The largest axis-aligned box that fits INSIDE the arena, because
    # the arena is rotated 0.55 deg from Vicon's axes. The nets are about 0.5 m
    # outside the arena (estimate, not measured) and reach about camera height
    # (3.3 m). Land fires 0.30 m and the motor cut 0.80 m outside this box
    # (constants in cf_core.py), so the cut line is beyond the nets.
    # RECOMPUTE THESE if washburn_calib.yaml or the arena size changes.
    # zmin stays 0.00: the drone has to be able to land on the floor.
    bounds: [-1.15, 5.81, -1.31, 1.62, 0.00, 2.80]

/crazyflie_teleop:
  ros__parameters:
    prefix: "cf1"
    rate_hz: 50.0
    hover_z: 0.60
    keyboard: "termios"       # "termios" works over SSH; "pygame" needs a display

/crazyflie_circle:
  ros__parameters:
    prefix: "cf1"
    vicon_topic: "/vicon/cf3/cf3"   # keep in step with the server's
    height: 1.0
    diameter: 0.5             # 0.5 m keeps the circle ~28 cm inside xmin from the current start spot
    laps: 2.0
    period_s: 10.0            # seconds per lap (~0.16 m/s at 0.5 m diameter)
    center: "start"           # "start" or "origin"
