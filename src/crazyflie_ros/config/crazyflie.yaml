# Parameters for the Vicon-fed Crazyflie driver.
#
# Units are metres, seconds, degrees per second, and Hz. Read the UNITS block
# at the top of crazyflie_server.py before changing anything that touches yaw.

/crazyflie_server:
  ros__parameters:
    uri: "radio://0/80/2M/E7E7E7E701"
    vicon_topic: "/vicon/crazyflie_a2/crazyflie_a2"
    prefix: "cf1"

    control_hz: 50.0          # setpoint transmit rate
    extpose_hz: 50.0          # mocap -> EKF injection rate; keep <= 100 on a 2M link
    mocap_expected_hz: 100.0  # what Vicon is expected to publish at

    # No cmd_* for this long while flying and the driver stops relaying and
    # holds position. Must stay well inside the firmware's own 500 ms
    # COMMANDER_WDT_TIMEOUT_STABILIZE so that we decide, not the firmware.
    command_timeout: 0.30

    max_yaw_rate_dps: 720.0   # above this AND >45 deg in one frame -> solver flip
    yaw_sign: 1               # flip to -1 if yaw commands act backwards.
                              # VERIFY WITH THE PROPELLERS OFF.
    yaw_offset: 0.0           # empirical rotation applied to the injected quat

    pos_only: false           # true = withhold the quaternion, inject position only
    no_fly: false             # true = connect and inject, never spin a motor

    hover_z: 0.60
    # volume: [2.0, 2.0, 1.20]   # width(x), depth(y), ceiling(z); auto-centred
                                 # on the drone's position at startup. Only
                                 # sane in a small, symmetric space.
    # bounds: [xmin, xmax, ymin, ymax, zmin, zmax]  -- absolute, Vicon frame.
    # These are the PEAR volume. The scene map
    # (scenes/a2_train/a2_train.txt) explains how each number was
    # chosen: y and z from what Vicon tracks, pulled in far enough that a
    # geofence KILL -- 0.80 m past the soft bound -- still lands inside tracked
    # space; x tighter still, because the splat has no floor beyond it.
    # zmin is the one number that deliberately DISAGREES with that map, which
    # says 0.30. The map's boundary is where a PLAN may go; this is where the
    # drone may be, and it still has to be able to land.
    # Measure your own room; do not inherit these.
    bounds: [-0.50, 5.25, -1.20, 1.20, 0.00, 1.80]

    # ---- IMU stream -> <prefix>/imu (sensor_msgs/Imu, body FLU, rad/s, m/s^2)
    enable_imu_log: true      # one 24-byte log packet per sample
    imu_log_hz: 100.0         # rounded to a 10 ms multiple; 100 is the max
    imu_log_attitude: false   # extra stabilizer.roll/pitch block (tilt guard
                              # second opinion); costs another log stream

    # ---- Body-rate + collective-thrust path (cmd_rate). READ docs/RATE_MODE.md.
    # Both switches OFF by default. With either off, cmd_rate is refused.
    # rate_mode_setup: true makes the driver WRITE flightmode.stabModeRoll=0 and
    # stabModePitch=0 at each takeoff and restore 1 on land/stop/emergency/
    # shutdown. Deliberately left false until the owner approves it.
    enable_rate_cmd: false
    rate_mode_setup: false
    rate_max_rp_dps: 120.0    # = isaaclab.bodyrate_rp_max_deg (training cap)
    rate_max_yaw_dps: 360.0   # = isaaclab.bodyrate_yaw_max_deg
    rate_tilt_limit_deg: 60.0 # tilt beyond this while flying rates -> land
    rate_att_max_age_s: 0.10  # rate output needs an attitude sample this fresh
    # Collective N -> thrust word. Per-motor force [N] = c0 + c1*u + c2*u^2.
    # Default: firmware with CONFIG_ENABLE_THRUST_BAT_COMPENSATED (u linear in
    # N, 0.12 N per motor at 65535, battery compensated onboard).
    # Raw-PWM firmware: [5.484560e-4, 1.032633e-6, 2.130295e-11] (Foerster 2015).
    # Use floats only (0.0, not 0): rclpy rejects mixed int/float arrays.
    thrust_poly: [0.0, 1.8310826276035706e-06, 0.0]
    thrust_scale: 1.0         # from scripts/calibrate_thrust.py
    rate_allow_raw_pwm: false # bench only: RateThrust.thrust_pwm bypasses the N map
    thrust_pwm_min: 10001     # cf_core.ATT_THRUST_MIN
    thrust_pwm_max: 55000     # cf_core.ATT_THRUST_MAX

/crazyflie_teleop:
  ros__parameters:
    prefix: "cf1"
    rate_hz: 50.0
    hover_z: 0.60
    keyboard: "termios"       # "termios" works over SSH; "pygame" needs a display
