# Without this file setuptools installs the console_scripts into
# install/crazyflie_ros/bin/, and `ros2 run` / `ros2 launch` look in
# install/crazyflie_ros/lib/crazyflie_ros/ (the libexec directory). The build
# then SUCCEEDS and the launch fails with "libexec directory does not exist".
# ament_python packages need this redirect; it is not optional.
[develop]
script_dir=$base/lib/crazyflie_ros

[install]
install_scripts=$base/lib/crazyflie_ros
